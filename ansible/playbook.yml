---
- name: Deploy Wiki.js
  hosts: "{{ target_hosts | default('web') }}"
  become: true

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - docker.io
          - python3-docker
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Run Wiki.js container
      community.docker.docker_container:
        name: wikijs
        image: ghcr.io/requarks/wiki:2
        state: started
        restart_policy: unless-stopped
        recreate: true
        published_ports:
          - "3000:3000"
        env:
          DB_TYPE: postgres
          DB_HOST: "{{ db_host }}"
          DB_PORT: "{{ db_port | string }}"
          DB_USER: "{{ db_user }}"
          DB_PASS: "{{ db_password }}"
          DB_NAME: "{{ db_name }}"
          HA_ACTIVE: "1"