---
- name: Deploy Wiki.js and monitoring
  hosts: "{{ target_hosts | default('web') }}"
  become: true

  vars_files:
    - upmon_checks.yml

  tasks:
    - name: Install Datadog Agent
      ansible.builtin.import_role:
        name: datadog.dd.agent
      vars:
        datadog_api_key: "{{ dd_api_key }}"
        datadog_site: "{{ dd_site | default('datadoghq.com') }}"
        datadog_config:
          tags:
            - "env:dev"
            - "project:wikijs"
            - "service:wikijs"
        datadog_checks:
          http_check:
            init_config:
            instances:
              - name: wikijs_local
                url: http://127.0.0.1:3000/
                timeout: 5
                method: GET
                http_response_status_code: "1xx|2xx|3xx"

    - name: Install packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - docker.io
          - python3-docker
          - cron
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Run Wiki.js container
      community.docker.docker_container:
        name: wikijs
        image: ghcr.io/requarks/wiki:2
        state: started
        restart_policy: unless-stopped
        recreate: true
        published_ports:
          - "3000:3000"
        env:
          DB_TYPE: postgres
          DB_HOST: "{{ db_host }}"
          DB_PORT: "{{ db_port | string }}"
          DB_USER: "{{ db_user }}"
          DB_PASS: "{{ db_password }}"
          DB_NAME: "{{ db_name }}"
          HA_ACTIVE: "1"

    - name: Install Upmon Wiki.js check script
      ansible.builtin.copy:
        dest: /usr/local/bin/wikijs-upmon-check
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          APP_URL="http://127.0.0.1:3000/"
          PING_URL="{{ upmon_checks[inventory_hostname].ping_url }}"

          if curl -fsS -m 10 -o /dev/null "$APP_URL"; then
            curl -fsS -m 10 --retry 3 -o /dev/null "$PING_URL"
          fi

    - name: Enable and start cron
      ansible.builtin.systemd:
        name: cron
        enabled: true
        state: started

    - name: Install Upmon cron job
      ansible.builtin.copy:
        dest: /etc/cron.d/wikijs-upmon-check
        owner: root
        group: root
        mode: "0644"
        content: |
          * * * * * root /usr/local/bin/wikijs-upmon-check
